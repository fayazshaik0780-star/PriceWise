[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/products/search"
  to = "/.netlify/functions/products-search"
  status = 200
[[redirects]]
  from = "/api/retailer-search"
  to = "/.netlify/functions/retailer-search"
  status = 200